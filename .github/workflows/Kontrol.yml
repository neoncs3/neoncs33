# NeonCS otomatik domain kontrolü
name: Domain Değişiklik Kontrolü

concurrency:
  group: neon-domain-control-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */9 * * *"

permissions:
  contents: write
  actions: write

jobs:
  DomainKontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Depo Kontrolü
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Python 3.11.8 Yükle
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.8"

      - name: Python Sürümünü Göster
        run: python -c "import sys; print(sys.version)"

      - name: Gereksinimleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -U setuptools wheel Kekik cloudscraper pycryptodome

      - name: Doğrulanmış domainleri tara
        run: python KONTROL.py

      - name: Değişiklik Kontrolü
        id: degisiklik_kontrol
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "degisiklik=true" >> "$GITHUB_OUTPUT"
          else
            echo "degisiklik=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Doğrulanmış değişiklikleri otomatik kaydet
        if: steps.degisiklik_kontrol.outputs.degisiklik == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
            exit 0
          fi

          BUILD_REQUIRED=false
          if git diff --cached --name-only | grep -Eq '(^|/)(build\.gradle\.kts|src/main/kotlin/.*\.kt)$|^NeonCore/domains\.json$'; then
            BUILD_REQUIRED=true
          fi

          git diff --cached --stat
          git commit -m "♻️ Doğrulanmış domain ve durum raporlarını güncelle"

          PUSHED=false
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              PUSHED=true
              break
            fi
            echo "Push denemesi $attempt başarısız; master yeniden alınacak."
          done

          if [[ "$PUSHED" != "true" ]]; then
            echo "::error::Değişiklikler master dalına gönderilemedi."
            exit 1
          fi

          if [[ "$BUILD_REQUIRED" == "true" ]]; then
            echo "Kaynak/domain manifesti değişti; derleme otomatik başlatılıyor."
            gh workflow run Derleyici.yml --repo "$REPO_OWNER/$REPO_NAME" --ref master
          else
            echo "Yalnızca durum/aday verileri değişti; Kotlin derlemesi gerekmiyor."
          fi

      - name: Değişiklik yok
        if: steps.degisiklik_kontrol.outputs.degisiklik != 'true'
        run: echo "Doğrulanmış domain değişikliği yok; mevcut mainUrl değerleri korunuyor."
