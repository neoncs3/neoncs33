# NeonCS otomatik domain kontrolü

name: Domain Değişiklik Kontrolü

concurrency:
  group: neon-domain-control-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */9 * * *"

jobs:
  DomainKontrol:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Depo Kontrolü
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11.8 Yükle
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.8"

      - name: Python Sürümünü Göster
        run: python -c "import sys; print(sys.version)"

      - name: Gereksinimleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -U setuptools wheel Kekik cloudscraper pycryptodome

      - name: Açık domain PR kontrolü
        id: acik_pr
        run: |
          COUNT=$(gh pr list --repo "$REPO_OWNER/$REPO_NAME"             --head "domain-degisikligi"             --base "master"             --state open             --json number             --jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Domainleri Kontrol Et
        if: steps.acik_pr.outputs.count == '0'
        run: python KONTROL.py

      - name: Değişiklik Kontrolü
        if: steps.acik_pr.outputs.count == '0'
        id: degisiklik_kontrol
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "degisiklik=true" >> "$GITHUB_OUTPUT"
          else
            echo "degisiklik=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Domain Branch ve PR
        if: steps.acik_pr.outputs.count == '0' && steps.degisiklik_kontrol.outputs.degisiklik == 'true'
        run: |
          BRANCH="domain-degisikligi"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add -A
          git commit             --author="neoncs3 <neoncs3@users.noreply.github.com>"             -m "♻️ Domain Değişikliği"             -m "🔄 mainUrl ve NeonCore domain manifesti otomatik güncellendi."

          git push origin "$BRANCH" --force

          OPEN_PR=$(gh pr list --repo "$REPO_OWNER/$REPO_NAME"             --head "$BRANCH"             --base "master"             --state open             --json number             --jq 'length')

          if [[ "$OPEN_PR" == "0" ]]; then
            gh pr create               --repo "$REPO_OWNER/$REPO_NAME"               --head "$BRANCH"               --base "master"               --title "♻️ Domain Değişikliği"               --body "🔄 Otomatik domain değişikliği algılandı. mainUrl değerleri ve NeonCore manifesti güncellendi."
          fi

      - name: Açık PR nedeniyle atlandı
        if: steps.acik_pr.outputs.count != '0'
        run: echo "Açık domain-degisikligi PR'si bulundu; yeni bir domain PR'si oluşturulmadı."
