name: NeonCS Sağlık Kontrolü

on:
  schedule:
    - cron: "29 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "**/*.kt"
      - "NeonCore/**"
      - "tools/provider_health.py"
      - "KONTROL.py"
      - ".github/workflows/Saglik.yml"
      - "repo.json"

permissions:
  contents: write

concurrency:
  group: neon-health-${{ github.repository }}
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynakları al
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gereksinimleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install -U cloudscraper pycryptodome

      - name: Provider sağlık testi
        run: python3 tools/provider_health.py

      - name: GitHub Step Summary
        if: always()
        shell: bash
        run: |
          if [ -f health-status/index.md ]; then
            cat health-status/index.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sağlık raporunu commit et
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health-status

          if git diff --cached --quiet; then
            echo "Sağlık raporunda değişiklik yok."
            exit 0
          fi

          git commit -m "🩺 Provider sağlık raporunu güncelle"

          PUSHED=false
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              PUSHED=true
              break
            fi
            echo "Push denemesi $attempt başarısız; master yeniden alınacak."
          done

          if [[ "$PUSHED" != "true" ]]; then
            echo "::error::Sağlık raporu master dalına gönderilemedi."
            exit 1
          fi

      - name: Kırmızı sağlayıcıları hata olarak bildir
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          report = Path("health-status/summary.json")
          if not report.exists():
              print("::error::Sağlık raporu oluşturulmadı; provider hatalarını raporlayamıyorum.")
              sys.exit(1)

          try:
              data = json.loads(report.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"::error::Sağlık raporu JSON olarak okunamadı: {exc}")
              sys.exit(1)

          providers = data.get("providers", [])
          red = [
              item for item in providers
              if item.get("status") == "red"
          ]
          if red:
              print("::error::Bir veya daha fazla sağlayıcı erişim kontrolünden geçemedi.")
              for item in red:
                  live = item.get("live", {})
                  print(
                      f"::error title={item.get('provider', 'Bilinmeyen')}::"
                      f"domain={item.get('configured_domain', item.get('domain', '-'))}; "
                      f"HTTP={live.get('status_code', '-')}; "
                      f"hata={live.get('error') or 'HTTP erişimi başarısız'}"
                  )
              sys.exit(1)

          print(
              f"Sağlık raporu tamamlandı: {len(providers)} sağlayıcı; "
              f"kırmızı hata yok, sarı uyarı sayısı={data.get('yellow', 0)}."
          )
          PY
