name: NeonCS Sağlık Kontrolü

on:
  schedule:
    - cron: "29 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "**/*.kt"
      - "NeonCore/**"
      - "tools/provider_health.py"
      - ".github/workflows/Saglik.yml"
      - "repo.json"

permissions:
  contents: write

concurrency:
  group: neon-health-\${{ github.repository }}
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynakları al
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gereksinimleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install -U cloudscraper pycryptodome

      - name: Provider sağlık testi
        run: python3 tools/provider_health.py

      - name: GitHub Step Summary
        if: always()
        shell: bash
        run: |
          if [ -f health-status/index.md ]; then
            cat health-status/index.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sağlık raporunu commit et
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health-status

          if git diff --cached --quiet; then
            echo "Sağlık raporunda değişiklik yok."
            exit 0
          fi

          git commit -m "🩺 Provider sağlık raporunu güncelle"
          git push origin master
