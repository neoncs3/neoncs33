name: NeonCS Kalite Kontrolü

on:
  push:
    branches:
      - master
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "**/*.py"
      - ".github/workflows/**"
      - "repo.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynakları al
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repo doğrulaması
        run: python3 tools/validate_repo.py

      - name: Python sözdizimi
        run: python3 -m compileall -q tools KONTROL.py
