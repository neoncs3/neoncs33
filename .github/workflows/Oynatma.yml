name: NeonCS Gerçek Oynatma Testi

on:
  workflow_run:
    workflows:
      - CloudStream Derleyici
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neon-real-playback
  cancel-in-progress: false

jobs:
  playback:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: NeonCS kaynaklarını al
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: CloudStream kaynaklarını al
        run: git clone --depth 1 --branch master https://github.com/recloudstream/cloudstream.git cloudstream

      - name: Playback testini ekle
        run: |
          mkdir -p cloudstream/app/src/androidTest/java/com/lagradost/cloudstream3
          cp tools/NeonPlaybackSmokeTest.kt cloudstream/app/src/androidTest/java/com/lagradost/cloudstream3/NeonPlaybackSmokeTest.kt

      - name: KVM etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator ve gerçek ExoPlayer testi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          working-directory: cloudstream
          script: |
            bash ../tools/neon_playback_runner.sh


      - name: Playback raporunu oluştur
        if: always()
        run: python3 tools/format_playback_report.py
      - name: Playback tanı kayıtlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-playback-diagnostics
          path: |
            neon-playback-report.json
            playback-status/logcat.txt
            playback-status/instrumentation.log
          if-no-files-found: ignore

      - name: Playback raporunu GitHub'a yaz
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playback-status

          if git diff --cached --quiet; then
            echo "Playback raporunda değişiklik yok."
            exit 0
          fi

          git commit -m "🎬 Gerçek playback raporunu güncelle"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              exit 0
            fi

            echo "Push yarış nedeniyle başarısız oldu; master yeniden alınacak."
            git fetch origin master
            git rebase origin/master || {
              echo "Rebase çatışması oluştu."
              exit 1
            }
          done

          echo "Playback raporu master dalına gönderilemedi."
          exit 1
