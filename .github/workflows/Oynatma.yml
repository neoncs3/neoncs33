name: NeonCS Gerçek Oynatma Testi

on:
  workflow_run:
    workflows:
      - CloudStream Derleyici
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  # v2 releases the queue from a stuck earlier emulator run. The report-write step
  # checks timestamps so an older run cannot overwrite a newer report.
  group: neon-real-playback-master-v2
  cancel-in-progress: false

jobs:
  playback:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: NeonCS kaynaklarını al
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: CloudStream kaynaklarını al
        run: git clone --depth 1 --branch master https://github.com/recloudstream/cloudstream.git cloudstream

      - name: Playback testini ekle
        run: |
          mkdir -p cloudstream/app/src/androidTest/java/com/lagradost/cloudstream3
          cp tools/NeonPlaybackSmokeTest.kt cloudstream/app/src/androidTest/java/com/lagradost/cloudstream3/NeonPlaybackSmokeTest.kt

      - name: KVM etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator ve gerçek ExoPlayer testi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          working-directory: cloudstream
          script: |
            bash ../tools/neon_playback_runner.sh


      - name: Playback raporunu oluştur
        if: always()
        run: python3 tools/format_playback_report.py
      - name: Playback tanı kayıtlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-playback-diagnostics
          path: |
            neon-playback-report.json
            playback-status/logcat.txt
            playback-status/instrumentation.log
          if-no-files-found: ignore

      - name: Playback raporunu GitHub'a yaz
        if: always()
        shell: bash
        env:
          RUN_STARTED_AT: ${{ github.event.workflow_run.created_at || github.run_started_at }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          run_started_epoch="$(date -u -d "$RUN_STARTED_AT" +%s)"
          git fetch origin master

          # A previous emulator run got stuck and blocked newer runs. After it is
          # unblocked, it must not replace a playback report produced by a newer run.
          skip_if_stale_report() {
            latest_report_epoch="$(git log -1 --format=%ct origin/master -- playback-status/latest.json || true)"
            if [[ -n "$latest_report_epoch" && "$latest_report_epoch" -gt "$run_started_epoch" ]]; then
              echo "Bu testten daha yeni bir playback raporu zaten yayımlanmış; eski rapor atlanıyor."
              return 0
            fi
            return 1
          }

          if skip_if_stale_report; then exit 0; fi

          git add playback-status/latest.md playback-status/latest.json

          if git diff --cached --quiet; then
            echo "Playback raporunda değişiklik yok."
            exit 0
          fi

          git commit -m "🎬 Gerçek playback raporunu güncelle"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              exit 0
            fi

            echo "Push yarış nedeniyle başarısız oldu; master yeniden alınacak."
            git fetch origin master
            if skip_if_stale_report; then exit 0; fi
            git rebase origin/master || {
              echo "Rebase çatışması oluştu."
              exit 1
            }
          done

          echo "Playback raporu master dalına gönderilemedi."
          exit 1
