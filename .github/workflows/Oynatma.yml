name: NeonCS Gerçek Oynatma Testi

on:
  push:
    branches:
      - master
    paths:
      - "tools/NeonPlaybackSmokeTest.kt"
  workflow_run:
    workflows:
      - CloudStream Derleyici
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neon-real-playback
  cancel-in-progress: false

jobs:
  playback:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: NeonCS kaynaklarını al
        uses: actions/checkout@v4
        with:
          ref: master

      - name: CloudStream kaynaklarını al
        run: git clone --depth 1 --branch master https://github.com/recloudstream/cloudstream.git cloudstream

      - name: Playback testini ekle
        run: |
          mkdir -p cloudstream/app/src/androidTest/java/com/lagradost/cloudstream3
          cp tools/NeonPlaybackSmokeTest.kt cloudstream/app/src/androidTest/java/com/lagradost/cloudstream3/NeonPlaybackSmokeTest.kt

      - name: KVM etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator ve gerçek ExoPlayer testi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          working-directory: cloudstream
          script: |
            set -e
            APP_ID="com.lagradost.cloudstream3.prerelease.debug"
            REPORT="$RUNNER_TEMP/neon-playback-report.json"
            LOG="$GITHUB_WORKSPACE/playback-status/logcat.txt"

            mkdir -p "$GITHUB_WORKSPACE/playback-status"
            adb logcat -c || true
            trap 'adb logcat -d -v time > "$LOG" || true' EXIT

            ./gradlew :app:installPrereleaseDebug --no-daemon --stacktrace
            adb shell appops set --uid "$APP_ID" MANAGE_EXTERNAL_STORAGE allow || true
            adb shell mkdir -p /sdcard/Cloudstream3/plugins

            for plugin in AsyaFilmIzle DiziBoxizle DiziPal Dizigecesi Dramadizilerim FilmModu JetFilmizle SetFilmIzle SinemaCX WebDramaTurkey; do
              curl -fsSL "https://raw.githubusercontent.com/neoncs3/neoncs33/builds/$plugin.cs3" -o "$RUNNER_TEMP/$plugin.cs3"
              adb push "$RUNNER_TEMP/$plugin.cs3" "/sdcard/Cloudstream3/plugins/$plugin.cs3"
            done

            set +e
            ./gradlew :app:connectedPrereleaseDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.lagradost.cloudstream3.NeonPlaybackSmokeTest --no-daemon --stacktrace
            TEST_EXIT=$?
            set -e

            adb exec-out run-as "$APP_ID" cat files/neon-playback-report.json > "$REPORT" || true
            if [ -s "$REPORT" ]; then
              cp "$REPORT" "$GITHUB_WORKSPACE/neon-playback-report.json"
              cat "$REPORT"
            else
              echo '{"results":[],"pass":0,"blocked":0,"fail":1}' > "$GITHUB_WORKSPACE/neon-playback-report.json"
            fi

            exit "$TEST_EXIT"

      - name: Playback raporunu oluştur
        if: always()
        run: python3 tools/format_playback_report.py
      - name: Playback tanı kayıtlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-playback-diagnostics
          path: |
            neon-playback-report.json
            playback-status/logcat.txt
          if-no-files-found: ignore

      - name: Playback raporunu GitHub'a yaz
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playback-status
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "🎬 Gerçek playback raporunu güncelle"
          git push origin master
