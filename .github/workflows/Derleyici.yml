name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest

    steps:

      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4
        with:
          path: src
          ref: master

      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4
        with:
          path: builds
          ref: builds

      - name: Eski Derlemeleri Temizle
        run: |
          rm -f "$GITHUB_WORKSPACE"/builds/*.cs3

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Gradle Önbelleğini Temizle
        run: |
          rm -rf ~/.gradle/caches/modules-2/files-2.1/com.github.recloudstream
          rm -rf ~/.gradle/caches/modules-2/files-2.1/com.github.Blatzar

      - name: CloudStream Gradle Eklentisini Kontrol Et
        run: |
          echo "CloudStream Gradle plugin:"
          echo "com.github.recloudstream:gradle:81b1d42"

      - name: Eklentileri Derle
        working-directory: ${{ github.workspace }}/src
        run: |
          chmod +x gradlew

          ./gradlew make makePluginsJson --refresh-dependencies --stacktrace

          shopt -s globstar nullglob

          files=(**/build/*.cs3)

          if [ ${#files[@]} -eq 0 ]; then
            echo "HATA: Hiçbir .cs3 dosyası oluşmadı."
            exit 1
          fi

          cp "${files[@]}" "$GITHUB_WORKSPACE/builds/"

          if [ ! -f build/plugins.json ]; then
            echo "HATA: build/plugins.json oluşmadı."
            exit 1
          fi

          cp build/plugins.json "$GITHUB_WORKSPACE/builds/plugins.json"

      - name: Derleme Kontrolü
        run: |
          cd "$GITHUB_WORKSPACE/builds"

          echo ""
          echo "=========================================="
          echo "CS3 DOSYALARI"
          echo "=========================================="

          ls -lh *.cs3

          echo ""
          echo "=========================================="
          echo "SHA256"
          echo "=========================================="

          for f in *.cs3; do
            sha256sum "$f"
          done

          echo ""
          echo "=========================================="
          echo "PLUGINS.JSON"
          echo "=========================================="

          cat plugins.json

          echo ""
          echo "=========================================="
          echo "DOSYA BOYUTLARI"
          echo "=========================================="

          for f in *.cs3; do
            stat -c "%n -> %s bytes" "$f"
          done

          stat -c "%n -> %s bytes" plugins.json

      - name: Derlemeleri Yükle
        run: |
          cd "$GITHUB_WORKSPACE/builds"

          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          git add -A

          git status

          git commit -m "CloudStream eklentilerini güncelle $GITHUB_SHA" \
            || echo "Yeni değişiklik yok."

          git push origin builds
