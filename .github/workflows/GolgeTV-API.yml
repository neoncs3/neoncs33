name: GölgeTV API Tanılama

on:
  workflow_dispatch:
  # Upstream yeniden açılırsa otomatik fark edebilmek için 6 saatte bir kontrol et.
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/GolgeTV-API.yml"
      - "tools/golge_api_diagnose.py"
      - "GolgeTV/src/main/kotlin/com/neoncs3/GolgeTVProvider.kt"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kaynakları al
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Herkese açık yapılandırma ve katalog yanıtlarını ölç
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/golge_api_diagnose.py
      - name: Tanılama raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golgetv-api-diagnostic
          path: golgetv-api-diagnostic.json
          if-no-files-found: ignore
      - name: Güvenli raporu master dalına yaz
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s health-status/GolgeTV-API.md ]; then
            echo "# GölgeTV API Tanılama" > health-status/GolgeTV-API.md
            echo "Tanılama betiği bu çalıştırmada rapor üretemedi." >> health-status/GolgeTV-API.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health-status/GolgeTV-API.md
          if git diff --cached --quiet; then
            echo "Tanılama raporu değişmedi."
            exit 0
          fi
          git commit -m "🔎 GölgeTV API tanılama raporunu güncelle"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              exit 0
            fi
            git fetch origin master
            git rebase origin/master
          done
          echo "::error::Tanılama raporu master dalına yazılamadı."
          exit 1
